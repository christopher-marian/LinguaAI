version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
     - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your .env file}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
